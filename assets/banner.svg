<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Gage Nichols — Senior Cloud Security Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1430"/>
      <stop offset="0.55" stop-color="#121a38"/>
      <stop offset="1" stop-color="#0a1128"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nuc" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="spark">
      <path d="M0,-13 L2,-2 L13,0 L2,2 L0,13 L-2,2 L-13,0 L-2,-2 Z" fill="#fcd34d"/>
    </g>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="1200" height="220" rx="20" fill="url(#bg)"/>
  <rect x="6" y="6" width="1188" height="208" rx="16" fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1.5"/>
  <g fill="#22d3ee" fill-opacity="0.5">
    <circle cx="20" cy="20" r="2.5"/><circle cx="1180" cy="20" r="2.5"/>
    <circle cx="20" cy="200" r="2.5"/><circle cx="1180" cy="200" r="2.5"/>
  </g>

  <!-- perspective floor grid -->
  <g stroke="#22d3ee" stroke-opacity="0.10" stroke-width="1">
    <line x1="600" y1="110" x2="40" y2="214"/>
    <line x1="600" y1="110" x2="220" y2="214"/>
    <line x1="600" y1="110" x2="400" y2="214"/>
    <line x1="600" y1="110" x2="600" y2="214"/>
    <line x1="600" y1="110" x2="800" y2="214"/>
    <line x1="600" y1="110" x2="980" y2="214"/>
    <line x1="600" y1="110" x2="1160" y2="214"/>
    <line x1="40" y1="188" x2="1160" y2="188"/>
    <line x1="40" y1="200" x2="1160" y2="200"/>
    <line x1="40" y1="210" x2="1160" y2="210"/>
  </g>

  <!-- halo behind atom -->
  <circle cx="985" cy="108" r="140" fill="url(#halo)"/>

  <!-- atom -->
  <g>
    <g transform="rotate(0 985 108)"><ellipse cx="985" cy="108" rx="120" ry="40" fill="none" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="2"/></g>
    <g transform="rotate(60 985 108)"><ellipse cx="985" cy="108" rx="120" ry="40" fill="none" stroke="#67e8f9" stroke-opacity="0.6" stroke-width="2"/></g>
    <g transform="rotate(120 985 108)"><ellipse cx="985" cy="108" rx="120" ry="40" fill="none" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2"/></g>

    <!-- electrons -->
    <g transform="rotate(0 985 108)">
      <circle r="6" fill="#f472b6">
        <animateMotion dur="7s" repeatCount="indefinite" path="M 1105,108 A 120,40 0 1 1 865,108 A 120,40 0 1 1 1105,108"/>
      </circle>
    </g>
    <g transform="rotate(60 985 108)">
      <circle r="6" fill="#ff6b6b">
        <animateMotion dur="9s" repeatCount="indefinite" path="M 1105,108 A 120,40 0 1 1 865,108 A 120,40 0 1 1 1105,108"/>
      </circle>
    </g>
    <g transform="rotate(120 985 108)">
      <circle r="6" fill="#22d3ee">
        <animateMotion dur="11s" repeatCount="indefinite" path="M 1105,108 A 120,40 0 1 1 865,108 A 120,40 0 1 1 1105,108"/>
      </circle>
    </g>

    <!-- nucleus -->
    <circle cx="985" cy="108" r="18" fill="url(#nuc)"/>
    <circle cx="985" cy="108" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="985" cy="108" r="26" fill="none" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <!-- sparkles -->
  <use href="#spark" transform="translate(815,42) scale(0.7)" opacity="0.85"/>
  <use href="#spark" transform="translate(1140,170) scale(0.5)" opacity="0.7"/>
  <use href="#spark" transform="translate(700,58) scale(0.45)" opacity="0.6" fill="#f472b6"/>

  <!-- title -->
  <text x="60" y="112" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="68" font-weight="900" letter-spacing="6" fill="#22d3ee" opacity="0.5" filter="url(#soft)">GAGE NICHOLS</text>
  <text x="60" y="112" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="68" font-weight="900" letter-spacing="6" fill="url(#title)">GAGE NICHOLS</text>

  <!-- rule -->
  <rect x="62" y="130" width="560" height="2" fill="#ff6b6b" opacity="0.8"/>

  <!-- subtitle -->
  <text x="62" y="167" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="21" font-weight="700" letter-spacing="7" fill="#fef8e7">SENIOR CLOUD SECURITY ENGINEER</text>
</svg>
